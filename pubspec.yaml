name: notebook_pro
description: Lightweight desktop notepad — offline-first, Apple Notes inspired.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  flutter_quill: ^11.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  file_selector: ^1.0.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  intl: any
  collection: ^1.19.0
  flutter_localizations:
    sdk: flutter
  pasteboard: ^0.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
